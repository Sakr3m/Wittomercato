  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg-void);
    color: var(--text-hi);
    font-family: 'Space Grotesk', sans-serif;
    scroll-behavior: smooth;
  }

  body{
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,90,80,0.07), transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(61,120,255,0.08), transparent 45%);
    background-attachment: fixed;
  }

  /* ---------- HEADER ---------- */
  header{
    padding: 72px 24px 48px;
    text-align:center;
    position: relative;
  }

  h1{
    font-family:'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(36px, 7.5vw, 66px);
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 0.95;
    text-transform: uppercase;
    transform: skewX(-5deg);
    display: inline-block;
    background: linear-gradient(100deg, var(--left-a) 0%, #ffffff 48%, var(--right-a) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.55)) drop-shadow(6px 6px 0 rgba(255,61,84,0.18));
  }

  header{
    text-align:center;
  }

  /* ---------- TIMELINE / MONTHS ---------- */
  .timeline{
    max-width: 780px;
    margin: 0 auto;
    padding: 64px 20px 120px;
    position: relative;
  }

  .month{
    margin-bottom: 76px;
    position: relative;
  }

  .month-header{
    display:flex;
    align-items:baseline;
    gap: 16px;
    margin-bottom: 28px;
    cursor: pointer;
    user-select: none;
  }

  .chevron{
    width: 11px;
    height: 11px;
    border-right: 2px solid var(--text-mid);
    border-bottom: 2px solid var(--text-mid);
    transform: rotate(45deg);
    transition: transform 0.3s ease;
    flex-shrink: 0;
    margin-left: 4px;
  }

  .month.collapsed .chevron{
    transform: rotate(-45deg);
  }

  .matches{
    overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.25s ease;
  }

  .month-name{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: 32px;
    letter-spacing: 0.03em;
    color: var(--text-hi);
    text-transform: uppercase;
  }

  .month-index{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-low);
    letter-spacing: 0.1em;
  }

  .month-rule{
    flex:1;
    height:1px;
    background: linear-gradient(90deg, var(--line), transparent);
    align-self:center;
  }

  /* ---------- MATCH ROW ---------- */
  .matches{
    display:flex;
    flex-direction:column;
    gap: 18px;
  }

  .match{
    display:grid;
    grid-template-columns: 1fr 74px 1fr;
    align-items:stretch;
    gap: 0;
  }

  .slot{
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 20px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height: 84px;
    position: relative;
    overflow: hidden;
  }

  .slot.left{
    border-radius: 10px 0 0 10px;
    border-right: none;
    text-align:left;
    align-items:flex-start;
  }
  .slot.right{
    border-radius: 0 10px 10px 0;
    border-left: none;
    text-align:right;
    align-items:flex-end;
  }

  .slot::before{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width: 3px;
  }
  .slot.left::before{ left:0; background: linear-gradient(180deg, var(--left-a), var(--left-b)); }
  .slot.right::before{ right:0; background: linear-gradient(180deg, var(--right-a), var(--right-b)); }

  .game-title{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: 22px;
    letter-spacing:0.01em;
    line-height: 1.12;
    color: var(--text-hi);
    text-transform: uppercase;
  }

  .game-title a{
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted var(--text-low);
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .game-title a:hover{
    border-color: var(--text-hi);
  }

  .postponed-tag{
    position: absolute;
    top: 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffb23d;
    background: rgba(255,178,61,0.1);
    border: 1px solid rgba(255,178,61,0.35);
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
  }

  .slot.left .postponed-tag{ right: 14px; }
  .slot.right .postponed-tag{ left: 14px; }

  .slot.has-postponed{
    padding-top: 36px;
  }

  .player-name{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-mid);
    margin-top: 7px;
  }

  .player-name.left-tag::before{ content:"— "; color: var(--left-a); }
  .player-name.right-tag::after{ content:" —"; color: var(--right-a); }

  /* ---------- VS BADGE ---------- */
  .vs{
    background: var(--bg-panel);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }

  .vs-inner{
    width: 52px;
    height: 70px;
    -webkit-mask-image: var(--vs-img);
    mask-image: var(--vs-img);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    background: linear-gradient(150deg, var(--left-a) 0%, var(--left-b) 42%, var(--right-b) 58%, var(--right-a) 100%);
    filter: drop-shadow(0 0 10px rgba(255,90,80,0.35)) drop-shadow(0 0 10px rgba(61,90,255,0.25));
  }

  /* ---------- EMPTY / TBD MONTH ---------- */
  .month.tbd .matches{
    gap: 10px;
  }

  .tbd-row{
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 22px;
    text-align:center;
    color: var(--text-low);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .month.tbd .month-name,
  .month.tbd .month-index{
    color: var(--text-low);
  }

  footer{
    text-align:center;
    padding: 40px 20px 60px;
    color: var(--text-low);
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ---------- SCALING UNIFORME ---------- */
  /* Il contenuto ha una larghezza fissa (design width) e viene scalato
     interamente in base alla larghezza dello schermo, così la resa è
     identica (stesse proporzioni) su qualsiasi dispositivo o monitor. */
  html, body{
    overflow-x: hidden;
  }

  #scale-outer{
    width: 100%;
    overflow: hidden;
  }

  #scale-inner{
    width: 860px;
    margin: 0 auto;
    transform-origin: top center;
  }
</style>
</head>
<body>

<div id="scale-outer">
  <div id="scale-inner">
    <div class="timeline" id="timeline"></div>
    <footer>Sakrem — The Forgotten Shelf</footer>
  </div>
</div>

<script>
/* ============================================================

   Ogni mese ha una lista "matches" di massimo 3 sfide.
   Se un mese non ha ancora sfide, lascia matches: [] 
   e verrà mostrato come "in arrivo".
   ============================================================ */
const MESI = [
  {

    ]
  },
  {

    matches: [
      { gameL: "Lords of the Fallen 2",   playerL: "Sakrem",
        gameR: "Pax Autocratica",         playerR: "Sirian" },
      { gameL: "Marvel's Wolverine",      playerL: "Metello",
        gameR: "Monster Hunter Stories 3",playerR: "Rhaab" },
      { gameL: "Cairn",                   playerL: "Payload",
        gameR: "007 First Light",         playerR: "Renkas" },
    ]
  },
  {
    nome: "Aprile",
    numero: "03",
    matches: [
      { gameL: "Stonemachia",             playerL: "Sakrem",
        gameR: "Planet of Lana 2",        playerR: "Payload" },
      { gameL: "Mario Tennis Fever",      playerL: "Rhaab",
        gameR: "Pokémon Champions",       playerR: "Renkas" },
      { gameL: "Subnautica 2",            playerL: "Sirian",
        gameR: "FC 27",                   playerR: "Metello" },
    ]
  },
  {
    nome: "Maggio",
    numero: "04",
    matches: [
      { gameL: "Valor Mortis",            playerL: "Sakrem",
        gameR: "High on Life 2",          playerR: "Renkas" },
      { gameL: "Mouse: P.I. for Hire",    playerL: "Metello",
        gameR: "Halo Combat Evolved Remake", playerR: "Payload" },
      { gameL: "GTA 6",                   playerL: "Sirian",

    ]
  },
  {
    nome: "Giugno",

    matches: [
      { gameL: "Marvel 1943",             playerL: "Sirian",

  {

    matches: []

  {

    numero: "10",
    matches: []

  {
    nome: "Dicembre",
    numero: "11",
    matches: []
  },
];

function gameTitleHTML(name, url){
  return url
    ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>`
    : name;
}

function renderMonth(mese){
  const hasMatches = mese.matches && mese.matches.length > 0;
  const wrapper = document.createElement('div');
  wrapper.className = 'month' + (hasMatches ? '' : ' tbd');

  const header = document.createElement('div');
  header.className = 'month-header';
  header.innerHTML = `
    <span class="month-name">${mese.nome}</span>
    <span class="month-index">${mese.numero}</span>
    <span class="month-rule"></span>
    <span class="chevron"></span>
  `;
  wrapper.appendChild(header);

  const matchesEl = document.createElement('div');
  matchesEl.className = 'matches';

  if(hasMatches){
    mese.matches.forEach(m => {
      const row = document.createElement('div');
      row.className = 'match';
      row.innerHTML = `
        <div class="slot left${m.postponedL ? ' has-postponed' : ''}">
          ${m.postponedL ? '<span class="postponed-tag">rinviato</span>' : ''}
          <div class="game-title">${gameTitleHTML(m.gameL, m.gameLUrl)}</div>
          <div class="player-name left-tag">${m.playerL}</div>
        </div>
        <div class="vs"><div class="vs-inner"></div></div>
        <div class="slot right${m.postponedR ? ' has-postponed' : ''}">
          ${m.postponedR ? '<span class="postponed-tag">rinviato</span>' : ''}
          <div class="game-title">${gameTitleHTML(m.gameR, m.gameRUrl)}</div>
          <div class="player-name right-tag">${m.playerR}</div>
        </div>
      `;
      matchesEl.appendChild(row);
    });
  } else {
    const tbd = document.createElement('div');
    tbd.className = 'tbd-row';
    tbd.textContent = 'In arrivo';
    matchesEl.appendChild(tbd);
  }

  wrapper.appendChild(matchesEl);

  // Accordion: aperto di default, un click sull'header apre/chiude
  header.addEventListener('click', () => {
    const isCollapsed = wrapper.classList.contains('collapsed');
    if(isCollapsed){
      wrapper.classList.remove('collapsed');
      matchesEl.style.maxHeight = matchesEl.scrollHeight + 'px';
      matchesEl.style.opacity = '1';
      setTimeout(() => { matchesEl.style.maxHeight = 'none'; }, 350);
    } else {
      matchesEl.style.maxHeight = matchesEl.scrollHeight + 'px';
      requestAnimationFrame(() => {
        wrapper.classList.add('collapsed');
        matchesEl.style.maxHeight = '0px';
        matchesEl.style.opacity = '0';
      });
    }
  });

  return wrapper;
}

const timeline = document.getElementById('timeline');
MESI.forEach(m => timeline.appendChild(renderMonth(m)));

/* Scaling uniforme: il design ha una larghezza fissa (DESIGN_WIDTH),
   viene scalato in base alla larghezza reale dello schermo così la
   resa visiva (proporzioni, font, spaziature) è identica ovunque. */
const DESIGN_WIDTH = 860;
const scaleOuter = document.getElementById('scale-outer');
const scaleInner = document.getElementById('scale-inner');

function applyScale(){
  const scale = window.innerWidth / DESIGN_WIDTH;
  scaleInner.style.transform = `scale(${scale})`;
  scaleOuter.style.height = (scaleInner.offsetHeight * scale) + 'px';
}

window.addEventListener('resize', applyScale);
window.addEventListener('load', applyScale);
applyScale();

// Ricalcola l'altezza anche dopo ogni apertura/chiusura di un mese
// (la transizione max-height cambia l'altezza reale del contenuto)
const resizeObserver = new ResizeObserver(() => applyScale());
resizeObserver.observe(scaleInner);

</script>
